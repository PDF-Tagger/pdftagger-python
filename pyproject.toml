[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftagger"
dynamic = ["version"]
description = "Official Python SDK for the PDF Tagger API — auto-tag PDFs for PDF/UA accessibility."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "PDF Tagger" }]
keywords = [
    "pdf",
    "accessibility",
    "pdf-ua",
    "pdf/ua",
    "auto-tag",
    "tagging",
    "section-508",
    "wcag",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20", "build>=1.0"]

[project.urls]
Homepage = "https://pdf-tagger.com"
Documentation = "https://pdf-tagger.com/api/reference"
Source = "https://github.com/PDF-Tagger/pdftagger-python"
Issues = "https://github.com/PDF-Tagger/pdftagger-python/issues"

[tool.hatch.version]
path = "src/pdftagger/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
